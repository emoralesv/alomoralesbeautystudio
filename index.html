            "@type": "Question",
            "name": "¿Alo Morales Beauty Studio atiende a domicilio en Acapulco?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sí. El servicio a domicilio está disponible en Acapulco y alrededores, pero no está incluido de base en los paquetes. Para paquetes sociales a domicilio se requieren mínimo 4 paquetes más costo de traslado."

            "@type": "Question",

          },
          {
            "@type": "Question",
            "name": "¿Los paquetes de novia y XV años incluyen prueba de maquillaje y peinado?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "La prueba está incluida sólo en los paquetes donde se menciona explícitamente. Las pruebas se realizan en el studio antes del día del evento."

          },
          {
            "@type": "Question",
            "name": "¿Qué pasa si cancelo o necesito reagendar mi cita?",
            "acceptedAnswer": {
              "@type": "Answer",

            "name": "¿Atienden eventos temprano, antes de las 9:00 a.m.?",
            "acceptedAnswer": {

              "text": "Sí. Los servicios antes de las 09:00 a.m. se consideran horario de madrugada y tienen costo extra de $300 MXN por paquete."
            }
          },

            "name": "¿Ofrecen fotografía profesional y contenido para redes sociales?",
